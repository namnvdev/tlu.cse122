<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" role="img" aria-labelledby="title"><title id="title">Promise value flows through then callbacks while errors branch to catch</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#287bc1"/></marker><marker id="orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dc8b28"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#27834a"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#bd4545"/></marker></defs><rect width="1120" height="540" rx="20" fill="#f7fbff"/><text x="62" y="50" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#21683b">FULFILLED VALUE</text><rect x="55" y="78" width="180" height="72" rx="12" fill="#fff" stroke="#8bb9e8" stroke-width="2"/><text x="145" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#17365f">Promise</text><text x="145" y="134" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#536b91">profile</text><line x1="235" y1="114" x2="310" y2="114" stroke="#27834a" stroke-width="4" marker-end="url(#arrow)"/><rect x="310" y="78" width="175" height="72" rx="12" fill="#e5f5e9" stroke="#70b889" stroke-width="2"/><text x="397" y="121" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#21683b">.then()</text><line x1="485" y1="114" x2="560" y2="114" stroke="#27834a" stroke-width="4" marker-end="url(#arrow)"/><rect x="560" y="78" width="185" height="72" rx="12" fill="#e5f5e9" stroke="#70b889" stroke-width="2"/><text x="652" y="121" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#21683b">.then()</text><line x1="745" y1="114" x2="820" y2="114" stroke="#27834a" stroke-width="4" marker-end="url(#arrow)"/><rect x="820" y="78" width="230" height="72" rx="12" fill="#fff" stroke="#8bb9e8" stroke-width="2"/><text x="935" y="121" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#17365f">result · NAME</text><path d="M145 151 V265 H655 V320" fill="none" stroke="#bd4545" stroke-width="4" marker-end="url(#arrow)"/><text x="380" y="252" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#9c3636">rejection / thrown error</text><rect x="560" y="320" width="190" height="72" rx="12" fill="#fff0f0" stroke="#cf7777" stroke-width="3"/><text x="655" y="363" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#9c3636">.catch(error)</text><path d="M750 356 H820" fill="none" stroke="#bd4545" stroke-width="4" marker-end="url(#arrow)"/><rect x="820" y="320" width="230" height="72" rx="12" fill="#fff" stroke="#8bb9e8" stroke-width="2"/><text x="935" y="363" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#17365f">handle failure</text><rect x="55" y="430" width="995" height="82" rx="12" fill="#10243c" stroke="#10243c" stroke-width="1"/><text x="80" y="462" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#e2f1ff">getProfile(42).then(profile =&gt; profile.name).then(name =&gt; name.toUpperCase()).catch(handleError);</text><text x="80" y="492" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#c7ddf2">Mỗi then tạo Promise mới; rejection bỏ qua success handlers tới catch.</text></svg>