<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title"><title id="title">Badge absolute được định vị theo containing block với offset top và right</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#287bc1"/></marker><marker id="orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dc8b28"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#27834a"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#bd4545"/></marker></defs><rect width="1000" height="500" rx="20" fill="#f7fbff"/><text x="500" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#174f91">Card is the nearest positioned ancestor</text><rect x="100" y="75" width="800" height="355" rx="18" fill="#fff" stroke="#3988cf" stroke-width="4"/><rect x="120" y="95" width="760" height="315" rx="8" fill="none" stroke="#dc8b28" stroke-width="2"/><text x="145" y="126" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#9a5d17">Containing block · .card { position: relative }</text><rect x="170" y="160" width="650" height="68" rx="12" fill="#edf6ff" stroke="#c1d9ef" stroke-width="1"/><text x="202" y="203" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#17365f">Normal-flow title</text><rect x="170" y="250" width="650" height="105" rx="12" fill="#edf6ff" stroke="#c1d9ef" stroke-width="1"/><text x="202" y="293" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#17365f">Normal-flow content</text><text x="202" y="326" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#536b91">The card content keeps