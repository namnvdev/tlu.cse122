-weight="500" fill="#70420d">response arrives · ok is false</text><rect x="750" y="417" width="330" height="94" rx="12" fill="#fff0f0" stroke="#cf7777" stroke-width="2"/><text x="915" y="450" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#9c3636">Network failure</text><text x="915" y="481" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#743636">fetch Promise rejects · no Response</text></svg>