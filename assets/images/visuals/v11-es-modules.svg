<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" role="img" aria-labelledby="title"><title id="title">main.js imports named exports from the separate format.js module</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#287bc1"/></marker><marker id="orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dc8b28"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#27834a"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#bd4545"/></marker></defs><rect width="1040" height="470" rx="20" fill="#f7fbff"/><path d="M130 82H390L425 117V348H130Z" fill="#fff" stroke="#3988cf" stroke-width="3"/><path d="M390 82V117H425" fill="#d7ebff" stroke="#3988cf" stroke-width="3"/><text x="275" y="155" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#174f91">main.js</text><text x="275" y="207" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#17365f">import { formatName,</text><text x="275" y="237" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#17365f">courseCode }</text><text x="275" y="267" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#17365f">from "./format.js"</text><text x="275" y="309" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#536b91">dependent module</text><path d="M620 82H880L915 117V348H620Z" fill="#eaf5ff" stroke="#3988cf" stroke-width="3"/><path d="M880 82V117H915" fill="#d7ebff" stroke="#3988cf" stroke-width="3"/><text x="765" y="155" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#174f91">format.js</text><text x="765" y="213" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#21683b">export formatName()</text><text x="765" y="249" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#21683b">export courseCode</text><text x="765" y="309" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#536b91">named interface</text><path d="M420 215 H612" fill="none" stroke="#287bc1" stroke-width="4" marker-end="url(#arrow)"/><text x="515" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#24579c">import · depends on</text><text x="520" y="410" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#536b91">Imports refer to exported names; they do not merge the files.</text></svg>