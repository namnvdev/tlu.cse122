<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 650" role="img" aria-labelledby="title"><title id="title">Call Stack, Browser Timer, Task Queue và Event Loop với thứ tự A B C</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#287bc1"/></marker><marker id="orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dc8b28"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#27834a"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#bd4545"/></marker></defs><rect width="1180" height="650" rx="20" fill="#f7fbff"/><rect x="55" y="44" width="300" height="245" rx="18" fill="#fff" stroke="#3988cf" stroke-width="3"/><text x="205" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#174f91">CALL STACK</text><rect x="105" y="133" width="200" height="58" rx="8" fill="#eaf5ff" stroke="#8bb9e8" stroke-width="2"/><text x="205" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#17365f">B() · running</text><text x="205" y="219" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#536b91">A() already returned</text><rect x="445" y="44" width="300" height="245" rx="18" fill="#fff" stroke="#dc8b28" stroke-width="3"/><text x="595" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#9a5d17">BROWSER API</text><rect x="500" y="122" width="190" height="100" rx="12" fill="#fff0d9" stroke="#dc8b28" stroke-width="2"/><text x="595" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#70420d">Timer</text><text x="595" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#70420d">setTimeout(C, 0)</text><rect x="835" y="44" width="290" height="245" rx="18" fill="#fff" stroke="#70b889" stroke-width="3"/><text x="980" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#21683b">TASK QUEUE</text><rect x="895" y="130" width="170" height="80" rx="12" fill="#e7f6eb" stroke="#70b889" stroke-width="2"/><text x="980" y="165" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#21683b">C() · ready</text><text x="980" y="192" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#536b91">waits for empty stack</text><path d="M355 145 H490" fill="none" stroke="#dc8b28" stroke-width="4" marker-end="url(#arrow)"/><text x="422" y="129" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#9a5d17">schedule</text><path d="M745 165 H880" fill="none" stroke="#27834a" stroke-width="4" marker-end="url(#arrow)"/><text x="812" y="146" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#21683b">timer done</text><rect x="470" y="320" width="300" height="64" rx="32" fill="#eaf5ff" stroke="#3988cf" stroke-width="3"/><text x="620" y="360" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#174f91">EVENT LOOP · stack empty?</text><path d="M980 289 V350 H780" fill="none" stroke="#27834a" stroke-width="4" marker-end="url(#arrow)"/><path d="M470 352 H355 V275" fill="none" stroke="#287bc1" stroke-width="4" marker-end="url(#arrow)"/><text x="590" y="425" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#174f91">Execution sequence</text><circle cx="75" cy="490" r="26" fill="#eaf5ff" stroke="#3988cf" stroke-width="3"/><text x="75" y="497" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#174f91">1</text><text x="75" y="535" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17365f">A()</text><circle cx="245" cy="490" r="26" fill="#eaf5ff" stroke="#3988cf" stroke-width="3"/><text x="245" y="497" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#174f91">2</text><text x="245" y="535" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17365f">setTimeout(C)</text><circle cx="415" cy="490" r="26" fill="#eaf5ff" stroke="#3988cf" stroke-width="3"/><text x="415" y="497" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#174f91">3</text><text x="415" y="535" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17365f">B()</text><circle cx="585" cy="490" r="26" fill="#fff1dc" stroke="#dc8b28" stroke-width="3"/><text x="585" y="497" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#174f91">4</text><text x="585" y="535" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17365f">timer ends</text><circle cx="755" cy="490" r="26" fill="#fff1dc" stroke="#dc8b28" stroke-width="3"/><text x="755" y="497" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#174f91">5</text><text x="755" y="535" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17365f">C queued</text><circle cx="925" cy="490" r="26" fill="#eaf5ff" stroke="#3988cf" stroke-width="3"/><text x="925" y="497" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#174f91">6</text><text x="925" y="535" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17365f">stack empty</text><circle cx="1095" cy="490" r="26" fill="#e5f5e9" stroke="#70b889" stroke-width="3"/><text x="1095" y="497" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#174f91">7</text><text x="1095" y="535" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17365f">C runs</text><line x1="101" y1="490" x2="216" y2="490" stroke="#536b91" stroke-width="2" marker-end="url(#arrow)"/><line x1="271" y1="490" x2="386" y2="490" stroke="#536b91" stroke-width="2" marker-end="url(#arrow)"/><line x1="441" y1="490" x2="556" y2="490" stroke="#536b91" stroke-width="2" marker-end="url(#arrow)"/><line x1="611" y1="490" x2="726" y2="490" stroke="#536b91" stroke-width="2" marker-end="url(#arrow)"/><line x1="781" y1="490" x2="896" y2="490" stroke="#536b91" stroke-width="2" marker-end="url(#arrow)"/><line x1="951" y1="490" x2="1066" y2="490" stroke="#536b91" stroke-width="2" marker-end="url(#arrow)"/><text x="590" y="610" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#536b91">Console order: A → B → C. The timer never interrupts synchronous code.</text></svg>