<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 490" role="img" aria-labelledby="title"><title id="title">UI request lifecycle branches from loading into success, empty or error with retry</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#287bc1"/></marker><marker id="orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dc8b28"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#27834a"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#bd4545"/></marker></defs><rect width="1050" height="490" rx="20" fill="#f7fbff"/><rect x="55" y="185" width="190" height="90" rx="16" fill="#fff" stroke="#8bb9e8" stroke-width="2"/><text x="150" y="223" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#17365f">idle</text><text x="150" y="251" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#536b91">waiting</text><line x1="245" y1="230" x2="360" y2="230" stroke="#287bc1" stroke-width="4" marker-end="url(#arrow)"/><rect x="360" y="185" width="205" height="90" rx="16" fill="#eaf5ff" stroke="#3988cf" stroke-width="3"/><text x="462" y="223" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#174f91">loading</text><text x="462" y="251" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#536b91">request in progress</text><path d="M565 208 C620 208 625 90 700 90" fill="none" stroke="#27834a" stroke-width="3" marker-end="url(#arrow)"/><path d="M565 230 H700" fill="none" stroke="#27834a" stroke-width="3" marker-end="url(#arrow)"/><path d="M565 252 C620 252 625 370 700 370" fill="none" stroke="#bd4545" stroke-width="3" marker-end="url(#ar