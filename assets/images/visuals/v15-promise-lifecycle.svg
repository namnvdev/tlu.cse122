<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 450" role="img" aria-labelledby="title"><title id="title">Promise pending phân nhánh thành fulfilled hoặc rejected và cả hai đều settled</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#287bc1"/></marker><marker id="orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dc8b28"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#27834a"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#bd4545"/></marker></defs><rect width="1050" height="450" rx="20" fill="#f7fbff"/><rect x="70" y="160" width="230" height="105" rx="18" fill="#eaf5ff" stroke="#3988cf" stroke-width="3"/><text x="185" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#174f91">pending</text><text x="185" y="237" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#536b91">operation in progress</text><path d="M300 212 H415 V112 H545" fill="none" stroke="#287bc1" stroke-width="4" marker-end="url(#arrow)"/><path d="M415 212 V320 H545" fill="none" stroke="#287bc1" stroke-width="4" marker-end="url(#arrow)"/><rect x="545" y="65" width="300" height="105" rx="18" fill="#e5f5e9" stroke="#70b889" stroke-width="3"/><text x="695" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#21683b">fulfilled(value)</text><text x="695" y="144" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#536b91">success result</text><rect x="545" y="270" width="300" height="105" rx="18" fill="#fff0f0" stroke="#cf7777" stroke-width="3"/><text x="695" y="313" text-anchor="middle" font-family="Arial,sans-serif" font-size="25"