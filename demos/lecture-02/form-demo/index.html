<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Form đăng ký và native validation · CSE122</title>
  <style>
    :root{font-family:Arial,sans-serif;color:#102759;background:#f3f8ff;--blue:#0878f9;--line:#d4e6fb}*{box-sizing:border-box}body{margin:0;padding:20px}.wrap{max-width:760px;margin:auto}header{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}a{color:var(--blue);font-weight:bold;text-decoration:none}.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:22px;margin-top:18px}.muted{color:#586f90;line-height:1.6}.field{margin:14px 0}.field>label,legend{display:block;font-weight:bold;margin-bottom:6px}input,select,textarea{width:100%;border:1px solid #abc9ea;border-radius:7px;padding:10px;font:inherit}fieldset{border:1px solid var(--line);border-radius:8px;padding:12px;margin:15px 0}fieldset label{display:inline-flex;gap:7px;align-items:center;margin:7px 17px 0 0}fieldset input{width:auto}.hint{font-size:12px;color:#627895}.actions{display:flex;gap:9px;margin-top:16px}button{border:0;border-radius:7px;padding:11px 15px;background:var(--blue);color:white;font-weight:bold;cursor:pointer}button[type=reset]{background:#edf5ff;color:#174b87;border:1px solid var(--line)}output{display:block;margin-top:15px;padding:12px;border-radius:8px;background:#edf8f1;color:#145331;white-space:pre-wrap}output:empty{display:none}.return{display:inline-block;margin:18px 0}@media(max-width:500px){body{padding:12px}.panel{padding:16px}}
  </style>
</head>
<body><main class="wrap">
  <header><strong>CSE122 · Demo HTML Forms</strong><a href="../../../lectures/lecture-02/index.html">← Về Bài giảng 02</a></header>
  <section class="panel"><p class="muted">MINH HỌA TẠI CHỖ · LABEL, INPUT, NAME VÀ VALIDATION</p><h1>Đăng ký tham quan</h1><p class="muted">Các trường dùng validation gốc của browser. Dữ liệu hợp lệ chỉ hiện trên trang minh họa này, không gửi lên server.</p>
    <form id="registration">
      <div class="field"><label for="fullName">Họ và tên *</label><input id="fullName" name="fullName" autocomplete="name" required minlength="2" maxlength="60"><div class="hint">Bắt buộc · tối thiểu 2 ký tự</div></div>
      <div class="field"><label for="email">Email *</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="ten@example.com"></div>
      <div class="field"><label for="visitors">Số người *</label><input id="visitors" name="visitors" type="number" min="1" max="8" step="1" value="1" required></div>
      <fieldset><legend>Khung giờ *</legend><label><input type="radio" name="time" value="Buổi sáng" required> Buổi sáng</label><label><input type="radio" name="time" value="Buổi chiều"> Buổi chiều</label></fieldset>
      <div class="field"><label for="note">Ghi chú</label><textarea id="note" name="note" rows="3" maxlength="160"></textarea></div>
      <label class="consent"><input name="updates" type="checkbox" value="yes" style="width:auto"> Nhận thông tin cập nhật</label>
      <div class="actions"><button type="submit">Kiểm tra và xem dữ liệu</button><button type="reset">Nhập lại</button></div>
    </form>
    <output id="result" aria-live="polite"></output>
  </section><a class="return" href="../../../lectures/lecture-02/index.html">← Quay lại Lecture 02</a>
</main><script>
const form=document.querySelector('#registration'), result=document.querySelector('#result');
form.addEventListener('submit',event=>{event.preventDefault();const data=new FormData(form);result.textContent='Dữ liệu hợp lệ (minh họa):\\n'+[...data.entries()].map(([key,value])=>`${key} = ${value}`).join('\\n')+'\\n\\nKhông có dữ liệu nào được gửi ra ngoài trang.';});
form.addEventListener('reset',()=>{result.textContent='';});
</script></body></html>
