<body><main>
<p><a href="../../../lectures/lecture-08/index.html">← Về Bài giảng 08</a> · <a href="../../../index.html">Course Home</a></p>
<h1>Call stack và timer callback</h1>
<p class="meta">Mỗi lần chạy, các bước đồng bộ hoàn tất trước callback setTimeout.</p>
<section><button id="run" type="button">Chạy thứ tự log</button><ol id="log" aria-live="polite"></ol></section>
<section><h2>Mã đang chạy</h2><pre><code>console.log("A · bắt đầu");
setTimeout(() =&gt; console.log("C · timer"), 0);
console.log("B · tiếp tục đồng bộ");</code></pre></section>
</main>
<script>
const list = document.querySelector('#log');
let runNumber = 0;
function addLine(text) {
  const item = document.createElement('li');
  item.textContent = text;
  list.append(item);
}
document.querySelector('#run').addEventListener('click', () => {
  runNumber += 1;
  list.replaceChildren();
  const prefix = `Lần ${runNumber} · `;
  addLine(`${prefix}A — bắt đầu đồng bộ`);
  setTimeout(() => addLine(`${prefix}C — callback timer`), 0);
  addLine(`${prefix}B — tiếp tục đồng bộ`);
});
</script></body></html>
